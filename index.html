<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Remover</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body Styling */
    body {
      font-family: 'Poppins', sans-serif;
      background: #f9fafb; /* Clean, light background */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Container Styling */
    .container {
      background: white; /* Crisp white container */
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1); /* Soft shadow for depth */
      width: 90%;
      max-width: 600px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Header Styling */
    h1 {
      color: #2c3e50;
      font-size: 2.4em;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p {
      color: #7f8c8d;
      font-size: 1.1em;
      margin-bottom: 2rem;
    }

    /* Upload Section Styling */
    .upload-section {
      margin-bottom: 2rem;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
    }

    .upload-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
    }

    .file-name {
      display: block;
      margin-top: 1rem;
      color: #7f8c8d;
      font-size: 0.9em;
    }

    /* Process Button Styling */
    .process-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #27ae60, #219a52);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
    }

    .process-btn:disabled {
      background: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .process-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(39, 174, 96, 0.4);
    }

    /* Result Box Styling */
    .result-box {
      margin-top: 2rem;
      border: 2px dashed #bdc3c7;
      border-radius: 10px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .result-image {
      max-width: 100%;
      border-radius: 8px;
      display: none;
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Loader Styling */
    .loader {
      display: none;
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-radius: 50%;
      border-top: 4px solid #3498db;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Download Button Styling */
    .download-btn {
      display: none;
      margin-top: 1.5rem;
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
    }

    /* Footer Styling */
    footer {
      margin-top: 2rem; /* Add space between download button and footer */
      font-size: 0.9em;
      color: #7f8c8d;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Background Remover</h1>
    <p>Upload an image to remove its background instantly</p>
    
    <div class="upload-section">
      <input type="file" id="imageUpload" accept="image/*" hidden>
      <label for="imageUpload" class="upload-btn">
        <span class="icon">📁</span> Choose Image
      </label>
      <span id="fileName" class="file-name"></span>
    </div>

    <button id="removeBgBtn" class="process-btn" disabled>
      ✨ Remove Background
    </button>

    <div class="result-box">
      <div class="loader" id="loader"></div>
      <img id="resultImage" class="result-image" alt="Processed Image">
    </div>

    <!-- Download Button -->
    <button id="downloadBtn" class="download-btn">Download Image</button>

    <!-- Footer -->
    <footer>
      Made with ❤️ by Your Name
    </footer>
  </div>

  <script>
    const API_KEY = 'mB5e9rqBsv8uhDyEaXrUq6W7'; // Replace with your actual API key
    const API_URL = 'https://api.remove.bg/v1.0/removebg';

    const imageUpload = document.getElementById('imageUpload');
    const fileName = document.getElementById('fileName');
    const removeBgBtn = document.getElementById('removeBgBtn');
    const resultImage = document.getElementById('resultImage');
    const loader = document.getElementById('loader');
    const downloadBtn = document.getElementById('downloadBtn');

    // File Upload Handler
    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileName.textContent = file.name;
        removeBgBtn.disabled = false;
      }
    });

    // Background Removal Handler
    removeBgBtn.addEventListener('click', async () => {
      const file = imageUpload.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('image_file', file);
      formData.append('size', 'auto');

      // Show loader and clear previous result
      loader.style.display = 'block';
      resultImage.style.display = 'none';
      downloadBtn.style.display = 'none';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'X-Api-Key': API_KEY },
          body: formData
        });

        if (!response.ok) throw new Error('Background removal failed');
        
        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);
        resultImage.src = imageUrl;
        resultImage.style.display = 'block';

        // Enable download button
        downloadBtn.style.display = 'block';
        downloadBtn.onclick = () => downloadImage(imageUrl, 'processed-image.png');
        
      } catch (error) {
        console.error('Error:', error);
        alert('Error removing background. Please try again.');
      } finally {
        loader.style.display = 'none';
      }
    });

    // Download Image Function
    function downloadImage(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
